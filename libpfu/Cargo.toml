[package]
name = "libpfu"
version = "0.2.0"
edition = "2024"
description = "PackFixerUpper: bring up AOSC OS packages magically"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
ecow = { version = "0.3.1", features = ["serde"] }
futures = "0.3.34"
libabbs = { version = "0.2.0", path = "../libabbs" }
libpfu-source = { version = "0.3.0", path = "../libpfu-source" }
log = "0.4.34"
opendal = "0.59.5"
ouroboros = "0.18.5"
parking_lot = "0.13.0"
reqwest = "0.13.5"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }
