[package]
name = "libpfu-source"
version = "0.3.0"
edition = "2024"
description = "Source-code VFS resolver for ABBS scripts"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
bzip2 = "0.6.1"
flate2 = "1.1.10"
futures = "0.3.34"
libabbs = { version = "0.2.0", path = "../libabbs" }
log = "0.4.34"
opendal = { version = "0.59.5", features = ["services-github"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
xz2 = "0.1.7"
zstd = "0.14.3"
