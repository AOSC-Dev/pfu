[package]
name = "libpfu-fixers"
version = "0.2.0"
edition = "2024"
description = "Source-code analysis based lints for libPFU"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
ecow = "0.3.1"
libabbs = { version = "0.2.0", path = "../libabbs" }
libpfu = { version = "0.2.0", path = "../libpfu" }
log = "0.4.34"
oma-contents = { version = "0.19.2", features = ["aosc"] }
opendal = "0.59.5"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
